version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=Project_ISW1013
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
      - JWT_SECRET=cambia_esto_por_una_clave_muy_larga_y_segura_123!
      - JWT_EXPIRES_IN=1h
      - SESSION_SECRET=otra_clave_secreta_para_sesiones_456!
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=Project_ISW1013
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: