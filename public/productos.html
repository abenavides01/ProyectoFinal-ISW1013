<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Productos</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
  <main class="dashboard-container">
    <section class="dashboard-header">
      <div>
        <h1>Gestión de Productos</h1>
        <p class="subtitle">CRUD de productos - Proyecto Final ISW-1013</p>
      </div>
      <div class="header-actions">
        <a href="/dashboard.html" class="btn-secondary">Volver</a>
        <button id="logoutBtn" class="btn-secondary">Cerrar sesión</button>
      </div>
    </section>

    <section class="content-grid">
      <article class="card">
        <h2 id="formTitle">Crear producto</h2>

        <form id="productoForm" class="form">
          <input type="hidden" id="productoId">

          <div class="form-group">
            <label for="codigo">Código</label>
            <input type="text" id="codigo" required>
          </div>

          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" required>
          </div>

          <div class="form-group">
            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" rows="4"></textarea>
          </div>

          <div class="form-group">
            <label for="cantidad">Cantidad</label>
            <input type="number" id="cantidad" min="0" required>
          </div>

          <div class="form-group">
            <label for="precio">Precio</label>
            <input type="number" id="precio" min="0" step="0.01" required>
          </div>

          <div class="button-group">
            <button type="submit" class="btn-primary">Guardar</button>
            <button type="button" id="cancelarEdicionBtn" class="btn-secondary hidden">Cancelar edición</button>
          </div>
        </form>

        <p id="mensaje" class="message"></p>
      </article>

      <article class="card">
        <h2>Lista de productos</h2>

        <div class="table-container">
          <table class="products-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Código</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tablaProductos">
              <tr>
                <td colspan="7">Cargando productos...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </article>
    </section>
  </main>

  <script src="/js/productos.js"></script>
</body>

</html>
