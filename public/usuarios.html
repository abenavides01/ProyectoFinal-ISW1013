<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <main class="dashboard-container">
        <section class="dashboard-header">
            <div>
                <h1>Gestión de Usuarios</h1>
                <p class="subtitle">Administración de usuarios - Proyecto Final ISW-1013</p>
            </div>
            <div class="header-actions">
                <a href="/dashboard.html" class="btn-secondary">Volver</a>
                <button id="logoutBtn" class="btn-secondary">Cerrar sesión</button>
            </div>
        </section>

        <section class="content-grid">
            <article class="card" id="formCard">
                <h2 id="formTitle">Crear usuario</h2>

                <form id="usuarioForm" class="form">
                    <input type="hidden" id="usuarioId">

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password">
                    </div>

                    <div class="form-group">
                        <label for="rol">Rol</label>
                        <select id="rol" required class="form-select">
                            <option value="">Seleccionar rol</option>
                            <option value="SuperAdmin">SuperAdmin</option>
                            <option value="Auditor">Auditor</option>
                            <option value="Registrador">Registrador</option>
                        </select>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn-primary">Guardar</button>
                        <button type="button" id="cancelarBtn" class="btn-secondary hidden">Cancelar</button>
                    </div>
                </form>

                <p id="mensaje" class="message"></p>
            </article>

            <article class="card">
                <h2>Lista de usuarios</h2>
                <div class="table-container">
                    <table class="products-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Último login</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaUsuarios">
                            <tr>
                                <td colspan="6">Cargando usuarios...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </article>
        </section>
    </main>

    <script src="/js/usuarios.js"></script>
</body>

</html>
